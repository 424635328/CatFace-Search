name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same ref; a stale green tick is worse than none.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.6"
      - name: Ruff lint
        # ``--no-respect-gitignore`` is deliberate. Ruff honours .gitignore by default, so a
        # source file that .gitignore accidentally excludes is silently not linted — which is
        # how an ignored `src/catface/data/` package stayed unlinted until it was committed,
        # at which point CI reported twelve errors that no local run had shown. Linting
        # everything removes the blind spot.
        run: ruff check --no-respect-gitignore src tests tools
      - name: Ruff format check
        # Advisory until the tree is fully formatted.
        run: ruff format --check --no-respect-gitignore src tests tools || true

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package and test dependencies
        # The ``web`` extra is included so the HTTP contract is genuinely exercised in CI; the web
        # tests skip themselves when FastAPI is absent, so a core-only install still passes.
        run: pip install -e ".[cpu,dev]"

      - name: Unit tests
        # ``-m "not slow"`` keeps the suite free of network and GPU dependencies, so a
        # failure here is always a real regression rather than an infrastructure blip.
        run: pytest -q -m "not slow" --cov=catface --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: build and install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/catface --version
          /tmp/verify/bin/python -c "import catface; print('import ok', catface.__version__)"

  configs:
    name: validate shipped configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Every config in configs/ must parse
        # A broken reference config would silently invalidate the benchmark report.
        run: |
          python - <<'PY'
          import pathlib, sys
          from catface.config import PipelineConfig

          failures = []
          for path in sorted(pathlib.Path("configs").glob("*.yaml")):
              try:
                  config = PipelineConfig.from_yaml(path)
                  print(f"OK   {path}  fingerprint={config.fingerprint()}")
              except Exception as exc:
                  failures.append((path, exc))
                  print(f"FAIL {path}: {exc}")
          sys.exit(1 if failures else 0)
          PY

  container:
    name: container image builds
    runs-on: ubuntu-latest
    # The image is what a deployment actually runs, and it is exactly the artifact a static check
    # cannot verify: Dockerfile syntax, layer ordering, and whether the runtime stage really has the
    # package importable are only settled by a build. The static check in tools/check_container.py
    # catches COPY/ignore contradictions quickly and on every machine; this job is the authority.
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the runtime image
        run: docker build --target runtime --tag catface-search:ci .

      - name: The built image can start and answer a liveness probe
        # Starting the service without a checkpoint is the interesting case: the entry point must
        # refuse with an explanatory message rather than bind a port it cannot serve from. Asserting
        # the refusal is stronger than asserting nothing, because it pins the fail-fast behaviour.
        run: |
          set +e
          output=$(docker run --rm catface-search:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::the entry point reported success with no checkpoint configured"
            exit 1
          fi
          echo "$output" | grep -q "checkpoint not found" || {
            echo "::error::missing checkpoint did not produce the expected diagnostic"
            exit 1
          }

      - name: The image must not contain the model weights or the corpus
        # The assertion is on SIZE, not on the file name. A bare "no *.pt in the image" cannot tell a
        # 1 KB library fixture from an 86 MB checkpoint, so it would fail for the wrong reason and,
        # worse, could pass while a checkpoint sat in a layer under another name. What matters is
        # that no large artifact was baked in: weights and the manifest are mounted at run time.
        #
        # Single quotes around the shell command, not double: inside a double-quoted YAML scalar the
        # escaped \" collapses to ", which silently splits the find expression into separate
        # arguments and makes sh -c fail with "find: missing argument to -size". YAML does not
        # process single quotes, so the command reaches the shell intact.
        run: |
          offenders=$(docker run --rm --entrypoint sh catface-search:ci -c \
            'find / -xdev -type f -size +10240k \( -name "*.pt" -o -name "*.pth" -o -name "*.pkl" -o -name "*manifest*.jsonl" \) 2>/dev/null')
          if [ -n "$offenders" ]; then
            echo "::error::large model or corpus artifacts were baked into the image:"
            echo "$offenders"
            echo "Mount them instead, so a checkpoint can change without rebuilding the service."
            exit 1
          fi
          echo "no file larger than 10 MB matches a weights or manifest pattern"

      - name: Report image size
        # Not a gate. It is recorded because image size is the observable that silently regresses
        # when someone adds a dependency, and a number in the log is what makes that visible.
        #
        # Written as a block scalar because the Go template in --format contains a colon followed by
        # a space, which YAML reads as a mapping separator and rejects as a scanner error.
        run: |
          docker image inspect catface-search:ci --format '{{.Size}} bytes'
